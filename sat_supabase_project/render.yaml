services:
  - type: web
    name: sat-supabase
    runtime: docker
    dockerfilePath: ./sat_supabase_project/Dockerfile
    dockerContext: ./sat_supabase_project
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_TOKEN
        generateValue: true
